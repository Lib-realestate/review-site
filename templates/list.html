<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
{{GSC_TAG}}

<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta name="twitter:card" content="summary">

<link rel="alternate" type="application/rss+xml" title="{{SITE_NAME}}" href="{{RSS_URL}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ASSET_PATH}}css/style.css">
{{JSON_LD_BLOCK}}
</head>
<body{{BODY_STYLE}}>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="site-logo" href="{{HOME_PATH}}">{{SITE_NAME_HTML}}</a>
    <span class="site-tagline">{{TAGLINE}}</span>
  </div>
  <nav class="site-nav"><div class="wrap site-nav__inner">
    {{NAV_LINKS}}
  </div></nav>
</header>

<div class="wrap page-intro">
  <h1>{{H1}}</h1>
  <p>{{INTRO}}</p>
</div>

<div class="wrap">
  <div class="article-grid">
    {{CARDS}}
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <p>{{SITE_NAME}} — {{TAGLINE}}</p>
    <p>本サイトの記事にはアフィリエイトリンク（PR）を含みます。すべての商品を良い評価にはしておらず、合わない場面も含めて記載しています。</p>
  </div>
</footer>

</body>
</html>
